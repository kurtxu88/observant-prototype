<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Answer — Observant</title>
<link rel="stylesheet" href="/app/app.css" />
<link rel="stylesheet" href="/app/selfserve.css" />
<style>
  .an-wrap { max-width: 640px; margin: 0 auto; padding: 40px 22px 90px; }
  .an-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .an-brand { font-weight: 600; }
  .an-brand em { font-style: normal; color: #8a857c; font-weight: 400; }
  .an-powered { font-size: .85rem; color: #8a857c; }
  .an-hero h1 { font-size: 1.5rem; margin: 0 0 8px; }
  .an-hero p { color: #4a463f; line-height: 1.55; margin: 0 0 24px; }
  .an-q { margin-bottom: 20px; }
  .an-q label { display: block; font-weight: 500; margin-bottom: 7px; line-height: 1.4; }
  .an-q textarea { width: 100%; box-sizing: border-box; min-height: 72px; resize: vertical; }
  .an-reward { font-size: .85rem; color: #6b665d; background: linear-gradient(0deg,#fbf8f2,#fff); border: 1px solid #e6e3dd; border-radius: 10px; padding: 11px 13px; margin: 18px 0; }
  .an-done { text-align: center; padding: 30px 0; }
  .an-done h1 { font-size: 1.4rem; margin: 14px 0 8px; }
  .an-done p { color: #4a463f; line-height: 1.55; }
  .an-err { color: #b4291f; font-size: .85rem; margin-top: 10px; }
  .an-muted { color: #8a857c; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="/app/ui.jsx"></script>
<script type="text/babel" src="/app/answer.jsx"></script>
</body>
</html>
