<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your preferences — Observant</title>
<link rel="stylesheet" href="/app/app.css" />
<link rel="stylesheet" href="/app/selfserve.css" />
<style>
  .mg-wrap { max-width: 540px; margin: 0 auto; padding: 40px 22px 90px; }
  .mg-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .mg-brand { font-weight: 600; } .mg-brand em { font-style: normal; color: #8a857c; font-weight: 400; }
  .mg-powered { font-size: .85rem; color: #8a857c; }
  .mg-h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .mg-sub { color: #6b665d; line-height: 1.55; margin: 0 0 24px; }
  .mg-sec { border: 1px solid var(--border,#e6e3dd); border-radius: 12px; padding: 16px; margin: 0 0 14px; }
  .mg-sec h2 { font-size: 1rem; margin: 0 0 4px; }
  .mg-sec p { font-size: .85rem; color: #8a857c; margin: 0 0 12px; line-height: 1.5; }
  .mg-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .mg-chip { border: 1px solid var(--border,#e6e3dd); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-size: .85rem; cursor: pointer; }
  .mg-chip.on { border-color: var(--accent); background: #fbf3ee; color: var(--accent); font-weight: 600; }
  .mg-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .mg-btn { border: 1px solid var(--border,#e6e3dd); background: #fff; border-radius: 9px; padding: 9px 14px; font: inherit; font-size: .88rem; cursor: pointer; }
  .mg-btn:hover { border-color: var(--accent); }
  .mg-out h2 { color: #b4291f; }
  .mg-out .mg-btn { border-color: #e7c2bd; color: #b4291f; }
  .mg-confirm { display: flex; gap: 8px; align-items: flex-start; background: #f1f6f1; border: 1px solid #cfe3cf; border-radius: 10px; padding: 12px 14px; margin: 0 0 16px; font-size: .9rem; color: #2e5a3a; line-height: 1.5; }
  .mg-note { font-size: .82rem; color: #8a857c; line-height: 1.5; margin-top: 18px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" src="/app/ui.jsx"></script>
<script type="text/babel" src="/app/manage.jsx"></script>
</body>
</html>
