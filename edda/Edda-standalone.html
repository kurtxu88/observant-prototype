document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt-family: 'Spectral';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"75c11a06-be7a-4c2d-a4c1-1c1247c5edd1\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Color tokens (warm, low-chroma) */\n  --canvas:        oklch(0.985 0.006 78);\n  --canvas-deep:   oklch(0.968 0.010 74);\n  --surface:       oklch(0.972 0.013 72);\n  --surface-2:     oklch(0.955 0.016 70);\n  --ink:           oklch(0.255 0.013 56);\n  --ink-2:         oklch(0.255 0.013 56);\n  --text-primary:  oklch(0.265 0.013 56);\n  --text-secondary:oklch(0.445 0.012 56);\n  --text-muted:    oklch(0.595 0.010 60);\n  --border:        oklch(0.895 0.011 72);\n  --border-strong: oklch(0.835 0.013 70);\n  --accent:        oklch(0.575 0.118 41);\n  --accent-hover:  oklch(0.515 0.118 41);\n  --accent-soft:   oklch(0.93 0.030 50);\n  --accent-tint:   oklch(0.955 0.018 52);\n  --success:       oklch(0.560 0.072 152);\n\n  /* Dark band (used sparingly for contrast) */\n  --night:         oklch(0.255 0.018 58);\n  --night-2:       oklch(0.225 0.016 58);\n\n  /* Type */\n  --font-display: 'Spectral', Georgia, 'Times New Roman', serif;\n  --font-sans:    'Hanken Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;\n  --font-mono:    'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;\n\n  --maxw: 1180px;\n  --gutter: clamp(1.25rem, 4vw, 3rem);\n}\n\n/* ---------- reset ---------- */\n*, *::before, *::after { box-sizing: border-box; }\n* { margin: 0; }\nhtml { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; scroll-behavior: smooth; }\nbody {\n  font-family: var(--font-sans);\n  background: var(--canvas);\n  color: var(--text-primary);\n  font-size: 17px;\n  line-height: 1.65;\n  font-weight: 400;\n  overflow-x: hidden;\n}\nimg, svg { display: block; max-width: 100%; }\na { color: =======\n   FAQ\n   ============================================================ */\n.faq { display: flex; flex-direction: column; max-width: 760px; margin: 2.5rem auto 0; }\n.faq-item { border-top: 1px solid var(--border); }\n.faq-item:last-child { border-bottom: 1px solid var(--border); }\n.faq-q { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1.4rem 0; text-align: left; font-family: var(--font-display); font-size: 1.18rem; color: var(--text-primary); }\n.faq-q .plus { position: relative; width: 18px; height: 18px; flex-shrink: 0; }\n.faq-q .plus::before, .faq-q .plus::after { content: \"\"; position: absolute; background: var(--accent); transition: transform .3s; }\n.faq-q .plus::before { top: 8px; left: 0; width: 18px; height: 1.5px; }\n.faq-q .plus::after { left: 8px; top: 0; width: 1.5px; height: 18px; }\n.faq-item.open .plus::after { transform: scaleY(0); }\n.faq-a { max-height: 0; overflow: hidden; transition: max-height .4s cubic-bezier(.3,.7,.3,1); }\n.faq-a-inner { padding-bottom: 1.5rem; color: var(--text-secondary); font-size: 1rem; line-height: 1.6; max-width: 64ch; }\n\n/* ============================================================\n   CLOSING CTA\n   ============================================================ */\n.cta-final { text-align: center; }\n.cta-final .display { max-width: 18ch; margin: 1.4rem auto 0; }\n.cta-final .lead { max-width: 46ch; margin: 1.5rem auto 0; }\n.cta-final .hero-actions { justify-content: center; margin-top: 2.4rem; }\n\n/* ============================================================\n   FOOTER\n   ============================================================ */\n.footer { border-top: 1px solid var(--border); padding-block: 3.5rem 2.5rem; }\n.footer-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 2rem; }\n.footer h4 { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); font-weight: 500; }\n.footer ul { list-style: none; padding: 0; margin: 1rem 0 0; display: flex; flex-direction: column; gap: 0.6rem; }\n.footer ul a { font-size: 0.92rem; color: var(--text-secondary); transition: color .2s; }\n.footer ul a:hover { color: var(--accent); }\n.footer .tagline { margin-top: 1rem; font-size: 0.92rem; color: var(--text-muted); max-width: 32ch; }\n.footer-base { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); flex-wrap: wrap; gap: 1rem; }\n\n/* ============================================================\n   HERO PANEL (live 1:1s)\n   ============================================================ */\n.panel {\n  background: oklch(0.99 0.004 80);\n  border: 1px solid var(--border);\n  border-radius: 20px;\n  padding: 1.3rem 1.3rem 1.1rem;\n  box-shadow: 0 1px 2px oklch(0.3 0.02 60 / .04), 0 34px 64px -30px oklch(0.35 0.04 50 / .38), 0 12px 24px -18px oklch(0.35 0.04 50 / .22);\n}\n.panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }\n.panel-title { font-family: var(--font-display); font-size: 1.18rem; line-height: 1.1; }\n.panel-sub { font-family: var(--font-mono); font-size: 0.66rem; color: var(--text-muted); letter-spacing: 0.02em; margin-top: 0.25rem; }\n.panel .status { display: inline-flex; align-items: center; gap: 0.4em; font-family: var(--font-mono); font-size: 0.64rem; color: var(--success); text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }\n.panel .status .live-dot, .chat-head .status .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); animation: pulse 2.4s infinite; }\n.panel-meta { margin-top: 1.1rem; font-size: 0.9rem; color: var(--text-secondary); }\n.panel-meta strong { color: var(--text-primary); font-weight: 600; }\n.panel-rows { margin-top: 0.9rem; display: flex; flex-direction: column; gap: 0.15rem; }\n.panel-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.55rem; border-radius: 12px; transition: background .2s; }\n.panel-row:hover { background: var(--surface); }\n.panel-row.dim { opacity: 0.72; }\n.prow-ava { width: 30px; height: 30px; border-radius: 50%; color: oklch(0.99 0 0); display: grid; place-items: center; font-size: 0.78rem; font-weight: 600; flex-shrink: 0; }\n.prow-main { flex: 1; min-width: 0; }\n.prow-name { font-size: 0.88rem; font-weight: 600; color: var(--text-primary); }\n.prow-act { font-size: 0.76rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n.prow-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }\n.prow-dot.live { background: var(--success); box-shadow: 0 0 0 3px oklch(0.56 0.072 152 / .16); }\n.panel-foot { margin-top: 0.9rem; padding-top: 0.9rem; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; color: var(--text-secondary); }\n.panel-foot svg { color: var(--success); flex-shrink: 0; }\n.panel-foot strong { color: var(--text-primary); font-weight: 600; }\n\n/* ---------- social proof founder line ---------- */\n.founder-line { margin: 1.8rem auto 0; max-width: 64ch; text-align: center; font-size: 0.98rem; color: var(--text-secondary); line-height: 1.6; }\n.founder-line strong { color: var(--text-primary); font-weight: 600; }\n\n/* ---------- cohort composition card ---------- */\n.cohort-card { background: oklch(0.99 0.004 80); border: 1px solid var(--border); border-radius: 18px; padding: 1.6rem; box-shadow: 0 24px 50px -34px oklch(0.35 0.04 50 / .35); }\n.cohort-head { margin-bottom: 1.3rem; }\n.cohort { padding: 0.9rem 0; border-top: 1px solid var(--border); }\n.cohort:first-of-type { border-top: none; padding-top: 0; }\n.cohort-top { display: flex; align-items: baseline; justify-content: space-between; }\n.cohort-name { font-weight: 600; font-size: 0.98rem; color: var(--text-primary); }\n.cohort-n { font-family: var(--font-mono); font-size: 0.9rem; color: var(--text-secondary); }\n.cohort-bar { height: 7px; border-radius: 100px; background: var(--surface-2); margin-top: 0.55rem; overflow: hidden; }\n.cohort-bar i { display: block; height: 100%; border-radius: 100px; background: var(--accent); }\n.cohort-tag { margin-top: 0.5rem; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); letter-spacing: 0.01em; }\n\n/* ---------- who list ---------- */\n.who-list { list-style: none; padding: 0; margin: 2rem 0 0; display: flex; flex-direction: column; gap: 1.3rem; }\n.who-list li { display: flex; flex-direction: column; gap: 0.3rem; padding-left: 1.2rem; border-left: 2px solid var(--accent-soft); }\n.who-k { font-weight: 600; font-size: 1rem; color: var(--text-primary); }\n.who-d { font-size: 0.95rem; color: var(--text-secondary); }\n\n/* ---------- chat caption ---------- */\n.chat-caption { margin-top: 1.1rem; font-family: var(--font-mono); font-size: 0.74rem; color: var(--text-muted); line-height: 1.5; max-width: 42ch; }\n\n/* ---------- price note ---------- */\n.price-note { text-align: center; margin-top: 1.6rem; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.02em; }\n\n/* ============================================================\n   reveal animation\n   ============================================================ */\n.reveal { opacity: 0; transform: translateY(22px); transition: opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1); }\n.reveal.in { opacity: 1; transform: none; }\n.reveal.d1 { transition-delay: .08s; }\n.reveal.d2 { transition-delay: .16s; }\n.reveal.d3 { transition-delay: .24s; }\n.reveal.d4 { transition-delay: .32s; }\n@media (prefers-reduced-motion: reduce) {\n  .reveal { opacity: 1; transform: none; transition: none; }\n  .msg, .msg-relay { opacity: 1; transform: none; animation: none; }\n  html { scroll-behavior: auto; }\n}\n\n/* ============================================================\n   responsive\n   ============================================================ */\n@media (max-width: 940px) {\n  .hero-grid { grid-template-columns: 1fr; gap: 2.5rem; }\n  .hero-visual { max-width: 440px; }\n  .split, .split.flip { grid-template-columns: 1fr; gap: 2.5rem; }\n  .split.flip .split-text { order: 0; }\n  .stats { grid-template-columns: 1fr; gap: 1.5rem; }\n  .stat { padding-block: 0.2rem; }\n  .price-grid { grid-template-columns: 1fr; }\n  .who-cards { grid-template-columns: 1fr; }\n  .footer-grid { grid-template-columns: 1fr 1fr; gap: 2rem 1.5rem; }\n  .nav-links { display: none; }\n}\n@media (max-width: 560px) {\n  body { font-size: 16px; }\n  .cap { grid-template-columns: auto 1fr; }\n  .cap .cap-desc { display: none; }\n  .footer-grid { grid-template-columns: 1fr; }\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ============================ NAV ============================ -->\n<header class=\"nav\">\n  <div class=\"wrap nav-inner\">\n    <a class=\"wordmark\" href=\"#top\" aria-label=\"Edda home\">edda<span class=\"dot\"><\u002Fspan><\u002Fa>\n    <nav class=\"nav-links\">\n      <a href=\"#how\">How it works<\u002Fa>\n      <a href=\"#capabilities\">MCP<\u002Fa>\n      <a href=\"#pricing\">Pricing<\u002Fa>\n    <\u002Fnav>\n    <div class=\"nav-cta\">\n      <a href=\"#\" class=\"nav-signin\">Sign in<\u002Fa>\n      <a href=\"#cta\" class=\"btn btn-primary\">Get started<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"top\">\n\n<!-- ============================ HERO ============================ -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-text\">\n      <span class=\"eyebrow reveal\">The modern user-learning pipeline<\u002Fspan>\n      <h1 class=\"display reveal d1\">Let Edda learn<br>from your users —<br><span class=\"ital serif-em\">1:1, continuously,<br>at scale.<\u002Fspan><\u002Fh1>\n      <p class=\"lead reveal d2\">Whether you have a million users or your first ten, Edda automates how you learn from your power users — so you never build blind.<\u002Fp>\n      <div class=\"hero-actions reveal d3\">\n        <a href=\"#cta\" class=\"btn btn-primary btn-arrow\">Automate user learning now\n          <span class=\"btn-arrow\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14M13 6l6 6-6 6\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <\u002Fa>\n        <a href=\"#how\" class=\"btn btn-ghost\">See how it works<\u002Fa>\n      <\u002Fdiv>\n      <p class=\"hero-note reveal d3\">Bring your own users — or recruit a vetted panel. No noisy shared channels.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- hero visual: live panel -->\n    <div class=\"hero-visual reveal d2\">\n      <div class=\"panel\">\n        <div class=\"panel-head\">\n          <div>\n            <div class=\"panel-title\">Your panel<\u002Fdiv>\n            <div class=\"panel-sub\">power-users · launch traffic · recruited<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"status\"><span class=\"live-dot\"><\u002Fspan>Live<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"panel-meta\">Edda is in a 1:1 with <strong>5 users<\u002Fstrong> right now<\u002Fdiv>\n        <div class=\"panel-rows\">\n          <div class=\"panel-row\">\n            <span class=\"prow-ava\" style=\"background:oklch(0.62 0.10 30)\">D<\u002Fspan>\n            <div class=\"prow-main\"><div class=\"prow-name\">Dana K.<\u002Fdiv><div class=\"prow-act\">answering · weekly-export workflow<\u002Fdiv><\u002Fdiv>\n            <span class=\"prow-dot live\"><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"panel-row\">\n            <span class=\"prow-ava\" style=\"background:oklch(0.58 0.09 150)\">M<\u002Fspan>\n            <div class=\"prow-main\"><div class=\"prow-name\">Marcus T.<\u002Fdiv><div class=\"prow-act\">behavior-triggered follow-up<\u002Fdiv><\u002Fdiv>\n            <span class=\"prow-dot live\"><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"panel-row\">\n            <span class=\"prow-ava\" style=\"background:oklch(0.55 0.10 260)\">P<\u002Fspan>\n            <div class=\"prow-main\"><div class=\"prow-name\">Priya S.<\u002Fdiv><div class=\"prow-act\">onboarding interview · day 1<\u002Fdiv><\u002Fdiv>\n            <span class=\"prow-dot\"><\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"panel-row dim\">\n            <span class=\"prow-ava\" style=\"background:var(--border-strong)\">+2<\u002Fspan>\n            <div class=\"prow-main\"><div class=\"prow-name\">Leah, Owen<\u002Fdiv><div class=\"prow-act\">churn follow-up · scheduled<\u002Fdiv><\u002Fdiv>\n            <span class=\"prow-dot\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"panel-foot\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n          Synced with <strong>4 open questions<\u002Fstrong> from your team\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ SOCIAL PROOF ============================ -->\n<section class=\"proof reveal\">\n  <div class=\"wrap\">\n    <p class=\"proof-label\">The qualitative methodology inside Edda was built leading 0→1 research at<\u002Fp>\n    <div class=\"proof-logos\">\n      <span class=\"logo\">Robinhood<\u002Fspan>\n      <span class=\"logo\">Instagram<\u002Fspan>\n      <span class=\"logo\">Airbnb<\u002Fspan>\n      <span class=\"logo\">Stripe<\u002Fspan>\n      <span class=\"logo\">Google<\u002Fspan>\n      <span class=\"logo\">AWS<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"founder-line\">Founded by <strong>Xuan Zhao<\u002Fstrong> — former research director behind billion-dollar products at Robinhood, Instagram &amp; Airbnb. Edda encodes that craft, so it runs whether you have a research team or not.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ STATS ============================ -->\n<section class=\"section-sm\">\n  <div class=\"wrap stats\">\n    <div class=\"stat reveal\">\n      <div class=\"num\"><span class=\"accent\">500<\u002Fspan><\u002Fdiv>\n      <div class=\"lbl\">power users on private 1:1 lines, run in parallel — not one shared channel<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat reveal d1\">\n      <div class=\"num\">24<span style=\"font-size:0.55em\">/7<\u002Fspan><\u002Fdiv>\n      <div class=\"lbl\">always-on and behavior-triggered — the opposite of a one-off study<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat reveal d2\">\n      <div class=\"num\">5<span style=\"font-size:0.5em;letter-spacing:0\"> min<\u002Fspan><\u002Fdiv>\n      <div class=\"lbl\">to relay a question to the whole panel and watch the answers arrive<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ WHO YOU LEARN FROM ============================ -->\n<section class=\"section\" id=\"who\">\n  <div class=\"wrap split flip\">\n    <div class=\"split-visual reveal\">\n      <div class=\"cohort-card\">\n        <div class=\"cohort-head\">\n          <span class=\"eyebrow no-rule muted\">Your panel · composition<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"cohort\">\n          <div class=\"cohort-top\"><span class=\"cohort-name\">Power users<\u002Fspan><span class=\"cohort-n\">128<\u002Fspan><\u002Fdiv>\n          <div class=\"cohort-bar\"><i style=\"width:62%\"><\u002Fi><\u002Fdiv>\n          <div class=\"cohort-tag\">your best-customer profile<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cohort\">\n          <div class=\"cohort-top\"><span class=\"cohort-name\">Early adopters<\u002Fspan><span class=\"cohort-n\">74<\u002Fspan><\u002Fdiv>\n          <div class=\"cohort-bar\"><i style=\"width:38%;background:oklch(0.58 0.09 150)\"><\u002Fi><\u002Fdiv>\n          <div class=\"cohort-tag\">first to try what's new<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cohort\">\n          <div class=\"cohort-top\"><span class=\"cohort-name\">Recruited panel<\u002Fspan><span class=\"cohort-n\">50<\u002Fspan><\u002Fdiv>\n          <div class=\"cohort-bar\"><i style=\"width:26%;background:oklch(0.55 0.10 260)\"><\u002Fi><\u002Fdiv>\n          <div class=\"cohort-tag\">vetted via Prolific — your day-1 bridge<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"split-text reveal d1\">\n      <span class=\"eyebrow\">Who you learn from<\u002Fspan>\n      <h2 class=\"h2\">Start with the users<br>worth listening to.<\u002Fh2>\n      <p class=\"lead\">You choose your panel. Begin with your power users and early adopters — the people who match your best-customer profile and feel every rough edge first.<\u002Fp>\n      <ul class=\"who-list\">\n        <li>\n          <span class=\"who-k\">Bring your own<\u002Fspan>\n          <span class=\"who-d\">Drop a link to your users. Edda opens a private 1:1 line with each of them.<\u002Fspan>\n        <\u002Fli>\n        <li>\n          <span class=\"who-k\">Don't have users yet?<\u002Fspan>\n          <span class=\"who-d\">We recruit a vetted panel for you — Prolific is the day-one bridge to real, screened participants.<\u002Fspan>\n        <\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ HOW IT LEARNS ============================ -->\n<section class=\"section band-tint\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head reveal\">\n      <span class=\"eyebrow\">How it learns<\u002Fspan>\n      <h2 class=\"h2\">Continuous, like a diary study.<\u002Fh2>\n      <p class=\"lead\">Not a survey blast and not a one-off interview. Edda keeps a quiet, running relationship with each user — and tells you the moment something matters.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"split\" style=\"margin-top:3.5rem\">\n      <!-- chat demo -->\n      <div class=\"reveal\">\n        <div class=\"chat\">\n          <div class=\"chat-head\">\n            <span class=\"chat-ava\">E<\u002Fspan>\n            <div>\n              <div class=\"who\">Edda &amp; Dana K.<\u002Fdiv>\n              <div class=\"sub\">private 1:1 · in your product<\u002Fdiv>\n            <\u002Fdiv>\n            <div class=\"status\"><span class=\"live-dot\"><\u002Fspan>Live<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"chat-body\" data-animate=\"\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"chat-caption\">A real 1:1 — Edda starts it, your team relays a question mid-conversation, then books a live call.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- diary timeline -->\n      <div class=\"diary reveal d1\">\n        <div class=\"diary-row\">\n          <div class=\"diary-rail\"><span class=\"diary-num\">1<\u002Fspan><span class=\"diary-line\"><\u002Fspan><\u002Fdiv>\n          <div class=\"diary-content\"><h3 class=\"h3\">Onboards each user<\u002Fh3><p>A warm first conversation on their own private line — in your product, a browser companion, email, or the Edda app. Their pick.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"diary-row\">\n          <div class=\"diary-rail\"><span class=\"diary-num\">2<\u002Fspan><span class=\"diary-line\"><\u002Fspan><\u002Fdiv>\n          <div class=\"diary-content\"><h3 class=\"h3\">Watches real behavior<\u002Fh3><p>Light periodic check-ins plus signals from what people actually do — so questions land in context, not in a vacuum.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"diary-row\">\n          <div class=\"diary-rail\"><span class=\"diary-num\">3<\u002Fspan><span class=\"diary-line\"><\u002Fspan><\u002Fdiv>\n          <div class=\"diary-content\"><h3 class=\"h3\">Follows up in the moment<\u002Fh3><p>When something's interesting — a drop-off, a power move, a churn signal — Edda opens a 1:1 deep-dive while it's still fresh.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"diary-row\">\n          <div class=\"diary-rail\"><span class=\"diary-num\">4<\u002Fspan><span class=\"diary-line\"><\u002Fspan><\u002Fdiv>\n          <div class=\"diary-content\"><h3 class=\"h3\">Stays synced with your team<\u002Fh3><p>Relay a question and it threads into live conversations. Ask for a real 1:1 call and Edda finds the time.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"diary-row\">\n          <div class=\"diary-rail\"><span class=\"diary-num\">5<\u002Fspan><span class=\"diary-line\"><\u002Fspan><\u002Fdiv>\n          <div class=\"diary-content\"><h3 class=\"h3\">Surfaces insight, bottom-up<\u002Fh3><p>Findings rise on their own — and you can synthesize on demand across any cohort, behavior, or demographic.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ WHAT IT DOES ============================ -->\n<section class=\"section\" id=\"capabilities\">\n  <div class=\"wrap split flip\">\n    <!-- synthesis snapshot -->\n    <div class=\"reveal\">\n      <div class=\"synth\">\n        <div class=\"synth-head\">\n          <span class=\"dot3\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>\n          <span class=\"title\">synthesis · on demand<\u002Fspan>\n          <span class=\"badge\">252 users<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"synth-body\">\n          <div class=\"synth-q\">“Why do power users rebuild the export by hand?”<\u002Fdiv>\n          <div class=\"synth-theme reveal\">\n            <div class=\"t-head\"><span class=\"t-name\">Wants a live, shareable view<\u002Fspan><span class=\"t-pct\">61%<\u002Fspan><\u002Fdiv>\n            <div class=\"synth-bar\"><i data-w=\"61\"><\u002Fi><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"synth-theme\">\n            <div class=\"t-head\"><span class=\"t-name\">Reformats for stakeholders<\u002Fspan><span class=\"t-pct\">44%<\u002Fspan><\u002Fdiv>\n            <div class=\"synth-bar\"><i data-w=\"44\"><\u002Fi><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"synth-theme dim\">\n            <div class=\"t-head\"><span class=\"t-name\">Doesn't trust the raw numbers<\u002Fspan><span class=\"t-pct\">18%<\u002Fspan><\u002Fdiv>\n            <div class=\"synth-bar\"><i data-w=\"18\"><\u002Fi><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"synth-quote\">\n            <p>“I paste it into a sheet and rebuild half of it. A live dashboard is exactly the thing I keep wishing existed.”<\u002Fp>\n            <div class=\"src\">— Dana K. · power user · 3 weeks in panel<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"split-text reveal d1\">\n      <span class=\"eyebrow\">What it does<\u002Fspan>\n      <h2 class=\"h2\">Five jobs, one continuous relationship.<\u002Fh2>\n      <p class=\"lead\">Ask a question across the whole panel and get a synthesis in minutes — grounded in real 1:1 conversations, not a spreadsheet of ratings.<\u002Fp>\n      <div class=\"caps\">\n        <div class=\"cap\"><span class=\"cap-k\">01<\u002Fspan><span class=\"cap-name\">Onboarding interviews<\u002Fspan><span class=\"cap-desc\">Meet every new user the day they arrive<\u002Fspan><\u002Fdiv>\n        <div class=\"cap\"><span class=\"cap-k\">02<\u002Fspan><span class=\"cap-name\">Churn follow-ups<\u002Fspan><span class=\"cap-desc\">Catch the why before they're gone<\u002Fspan><\u002Fdiv>\n        <div class=\"cap\"><span class=\"cap-k\">03<\u002Fspan><span class=\"cap-name\">Behavior-triggered 1:1s<\u002Fspan><span class=\"cap-desc\">A deep-dive the moment it matters<\u002Fspan><\u002Fdiv>\n        <div class=\"cap\"><span class=\"cap-k\">04<\u002Fspan><span class=\"cap-name\">Synthesis on demand<\u002Fspan><span class=\"cap-desc\">Any cohort, behavior, or demographic<\u002Fspan><\u002Fdiv>\n        <div class=\"cap\"><span class=\"cap-k\">05<\u002Fspan><span class=\"cap-name\">Live team relays<\u002Fspan><span class=\"cap-desc\">Your questions, threaded into real talks<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ PRICING ============================ -->\n<section class=\"section band-tint\" id=\"pricing\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow no-rule\">Pricing<\u002Fspan>\n      <h2 class=\"h2\">Start free. Scale as the panel grows.<\u002Fh2>\n      <p class=\"lead\">Pay for the relationship, not the seat. Begin with a handful of power users; open it up when the signal earns it.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"price-grid\">\n      <div class=\"price-card reveal\">\n        <div class=\"tier\">Pilot<\u002Fdiv>\n        <div class=\"amt\">Free<\u002Fdiv>\n        <div class=\"pdesc\">Run one continuous program with up to 10 of your own users.<\u002Fdiv>\n        <ul class=\"price-feats\">\n          <li><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Up to 10 users on 1:1 lines<\u002Fli>\n          <li><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Onboarding + follow-up conversations<\u002Fli>\n          <li><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"> ed vetted panels, the MCP server, and controls for larger teams.<\u002Fdiv>\n        <ul class=\"price-feats\">\n          <li><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> Recruited panels via Prolific<\u002Fli>\n          <li><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> MCP for your agentic workflow<\u002Fli>\n          <li><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg> SSO, roles &amp; data controls<\u002Fli>\n        <\u002Ful>\n        <a href=\"#cta\" class=\"btn btn-ghost\" style=\"width:100%;justify-content:center\">Talk to us<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"price-note\">Indicative pricing — final plans scale with panel size and engagement.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============================ FAQ ============================ -->\n<section class=\"section\" id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"section-head center reveal\">\n      <span class=\"eyebrow no-rule\">Questions<\u002Fspan>\n      <h2 class=\"h2\">The honest answers.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"faq\">\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\">How is this different from surveys or a research panel?<span class=\"plus\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Surveys and one-off studies snapshot a moment, then go cold. Rented panels aren't your users. Edda keeps a continuous, in-context 1:1 relationship with the people who actually use your product — and does it at scale. That combination, 1:1 <em>and<\u002Fem> continuous, is the thing nothing else does.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\">Where do the 1:1 conversations happen?<span class=\"plus\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">On each user's own private line — inside your product, a browser companion, over email, or the Edda app. Their pick. It's never a noisy shared channel; every conversation is one-to-one.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\">I don't have users yet. Can I still start?<span class=\"plus\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Yes. Tell Edda your best-customer profile and we recruit a vetted panel for you — Prolific is the day-one bridge to real, screened participants — so you can start learning before launch.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\">Is it actually 1:1, or just automated blasts?<span class=\"plus\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Genuinely 1:1. Each user has a private line and a relationship that builds over time. Edda runs hundreds of these in parallel, so it feels personal to every user and scales for you.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"faq-item reveal\">\n        <button class=\"faq-q\">How does my team steer what Edda asks?<span class=\"plus\"><\u002Fspan><\u002Fbutton>\n        <div class=\"faq-a\"><div class=\"faq-a-inner\">Relay a question and it threads into live conversations across the panel. Need to hear it yourself? Request a live 1:1 and Edda finds the time. Your open questions stay synced as priorities shift.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ==
